[platformio]
src_dir = src
data_dir = datazip
extra_configs = platformio_override.ini

[env]
lib_deps =
	bblanchon/ArduinoJson @ 6.21.5
	knolleary/PubSubClient @ 2.8
	plerup/EspSoftwareSerial @ 8.2.0
extra_scripts =
	inject_build_info.py
	build_frontend.py
	embed_files.py
	gzip_littlefs.py
	sign_firmware.py

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
board_build.f_cpu = 160000000L
upload_speed = 921600
build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48
    -iquote src
    -DDISABLE_DEBUG_SERIAL
	-DUPDATE_SIGNING
	-DFILTER_6W_SPIKES=1
monitor_filters = 
	esp8266_exception_decoder
	default
upload_protocol = esptool
; upload_protocol = espota
; upload_port = wifiwhirl.local
; upload_flags = 
; 	--auth=wifiwhirl

[env:d1_mini_pro]
platform = espressif8266
board = d1_mini_pro
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
monitor_speed = 115200
board_build.f_cpu = 160000000L
upload_speed = 921600
build_flags = 
    -D PIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48
    -iquote src
    -DDISABLE_DEBUG_SERIAL
	-DUPDATE_SIGNING
	-DFILTER_6W_SPIKES=1
monitor_filters = 
	esp8266_exception_decoder
	default
upload_protocol = esptool
; upload_protocol = espota
; upload_port = wifiwhirl.local
; upload_flags = 
; 	--auth=wifiwhirl


